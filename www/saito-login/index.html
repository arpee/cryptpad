<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Saito Auth</title>
    <link rel="icon" type="image/png" href="/customize/favicon/main-favicon.png" id="favicon"/>
    <script src="/customize/pre-loading.js?ver=1.1"></script>
    <link href="/customize/src/pre-loading.css?ver=1.0" rel="stylesheet" type="text/css">
    <style>
        /* Override CryptPad's loading screen for our minimal auth UI */
        #saito-auth-status {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111;
            color: #aaa;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 99999;
        }
        #saito-auth-status .inner { text-align: center; }
        #saito-auth-status .spinner {
            width: 24px; height: 24px;
            border: 3px solid #333;
            border-top-color: #E3361C;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 12px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #saito-auth-status .error { color: #E3361C; }
    </style>
    <script async data-bootload="/saito-login/main.js" data-main="/common/boot.js?ver=1.0" src="/components/requirejs/require.js?ver=2.3.7"></script>
</head>
<body class="html">
    <div id="saito-auth-status">
        <div class="inner">
            <div class="spinner" id="spinner"></div>
            <div id="msg">Connecting Saito wallet…</div>
        </div>
    </div>
    <noscript></noscript>
</body>
</html>
