<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Saito Auth</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #aaa;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 14px;
        }
        .status { text-align: center; }
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid #333;
            border-top-color: #E3361C;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 12px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #E3361C; }
    </style>
</head>
<body>
    <div class="status">
        <div class="spinner" id="spinner"></div>
        <div id="msg">Connecting Saito wallet…</div>
    </div>

    <script data-bootload="/saito-login/main.js" src="/components/requirejs/require.js?ver=1.0"></script>
</body>
</html>
